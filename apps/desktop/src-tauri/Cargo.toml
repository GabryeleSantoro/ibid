[package]
name = "ibid-desktop"
version = "0.0.6"
description = "Local-first RAG desktop app"
authors = ["GabryeleSantoro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ibid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros"] }
futures-util = "0.3.34"
sysinfo = "0.39.6"
rand = "0.10.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
# tauri-plugin-updater turns on reqwest/rustls-no-provider; we install the provider ourselves in run().
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "linux-keyutils-keyring-store"] }
tauri-plugin-autostart = "=2.5.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
