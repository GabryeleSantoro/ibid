[project]
name = "ragcore"
version = "0.1.0"
description = "RAG core sidecar: ingestion, retrieval and generation over a local index"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120.0",
    "httpx>=0.28.1",
    "lancedb>=0.39.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.22",
    "py3langid>=0.4.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.11.0",
    "pypdfium2>=4.30.0",
    "rapidocr>=3.9.2",
    "uvicorn>=0.40.0",
]

[project.scripts]
ragcore = "ragcore.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
