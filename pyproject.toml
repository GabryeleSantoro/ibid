[project]
name = "ibid"
version = "0.1.0"
description = "Local-first RAG desktop app"
readme = "README.md"
authors = [
    { name = "GabryeleSantoro", email = "gabrielesantoro46@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["ragcore"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core/ragcore"]

[tool.uv.sources]
ragcore = { workspace = true }

[dependency-groups]
# Only used by scripts/build-sidecar.sh; keeps PyInstaller out of the dev env.
build = ["pyinstaller>=6.16"]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/ragcore/tests"]
markers = ["requires_models: needs a live llama-server on 8770/8771"]
addopts = "-m 'not requires_models'"
